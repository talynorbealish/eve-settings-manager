<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#5b53e6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#sheen)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Equalizer / sliders glyph: 3 vertical faders -->
  <g stroke-linecap="round">
    <!-- tracks -->
    <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="40">
      <line x1="336" y1="300" x2="336" y2="724"/>
      <line x1="512" y1="300" x2="512" y2="724"/>
      <line x1="688" y1="300" x2="688" y2="724"/>
    </g>
    <!-- knobs -->
    <g fill="#ffffff">
      <circle cx="336" cy="430" r="62"/>
      <circle cx="512" cy="600" r="62"/>
      <circle cx="688" cy="372" r="62"/>
    </g>
  </g>
</svg>
